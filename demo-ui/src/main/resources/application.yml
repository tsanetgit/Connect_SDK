spring:
  jackson:
    deserialization:
      # Jackson 3 flipped FAIL_ON_NULL_FOR_PRIMITIVES to true by default, so a
      # payload that omits a primitive creator property is now rejected where
      # Jackson 2 defaulted it (0/false). Restored to the Jackson 2 default so
      # the Boot 4 upgrade does not change the accepted wire format. Tightening
      # this is a deliberate contract change, not an upgrade side effect.
      fail-on-null-for-primitives: false

  mvc:
    formcontent:
      filter:
        # It runs ahead of the login check and reads a form-encoded PUT, PATCH or DELETE body.
        # Every mutating route here takes JSON or multipart, so nothing uses it.
        enabled: false

  servlet:
    multipart:
      # Read a multipart body only when a controller asks for a part, not for every request that
      # declares one, whatever its method or path.
      resolve-lazily: true
      # The direct-delivery (V2) demo hands a file to the SDK to stream into the
      # partner's store; the default 1 MB cap would stop it before the first grant.
      max-file-size: 20GB
      max-request-size: 20GB

server:
  port: 8090

tsanet:
  demo:
    # Per-env sqlite caches, credentials files, and the active-environment
    # marker all live under this directory.
    data-dir: ${TSANET_DEMO_DATA_DIR:${user.home}/.tsanet-demo-ui}
    default-environment: beta
    # Every environment's api-base-url must be https; a plain-http one is rejected at startup
    # unless allow-insecure-http is true. That switch exists for a local mock; it admits any
    # non-https host, so it stays false elsewhere.
    allow-insecure-http: false
    # Lets Settings register each environment's V2 receiver storage (AWS S3 or Azure Blob) for the
    # signed-in company. Reading and testing it are always available. Off by default: the platform
    # lets any API user of a company repoint its storage (tsanetgit/Connect-API-Code#170).
    receiver-storage-editable: ${TSANET_DEMO_RECEIVER_STORAGE_EDITABLE:false}
    # Locks the stored member credentials: Settings shows who each environment is signed in as
    # and the save / clear endpoints refuse (tsanetgit/Connect_SDK#152). For a hosted demo whose
    # credentials the operator pre-loads, so visitors only switch environments. Off by default.
    credentials-locked: ${TSANET_DEMO_CREDENTIALS_LOCKED:false}
    # Optional member credentials (password mode) written into an environment's store at startup
    # when that store is empty, so a hosted demo on an ephemeral filesystem comes up signed in and
    # can run locked (tsanetgit/Connect_SDK#152). Never overwrites a stored credential. Real values
    # come from the environment at launch (secrets on a hosted deploy); blank means no seed.
    seeds:
      beta:
        username: ${TSANET_DEMO_SEED_BETA_USERNAME:}
        password: ${TSANET_DEMO_SEED_BETA_PASSWORD:}
      dev:
        username: ${TSANET_DEMO_SEED_DEV_USERNAME:}
        password: ${TSANET_DEMO_SEED_DEV_PASSWORD:}
    # Production is connect2.tsanet.org — deliberately NOT listed here.
    # entra-tenant-id / entra-audience enable the OAuth client-credentials
    # login mode for an environment. Tenant is shared; audiences differ per
    # environment. Real values come from the environment at launch (never
    # committed - this is a public repo); when unset, the OAuth mode simply
    # does not appear for that environment. The member's client id and secret
    # are entered at runtime in Settings and never live here either.
    environments:
      beta:
        label: BETA
        api-base-url: https://connect2.tsanet.net
        entra-tenant-id: ${TSANET_DEMO_ENTRA_TENANT:}
        entra-audience: ${TSANET_DEMO_ENTRA_AUDIENCE_BETA:}
      dev:
        label: DEV
        api-base-url: https://connect2.tahoelab.us
        entra-tenant-id: ${TSANET_DEMO_ENTRA_TENANT:}
        entra-audience: ${TSANET_DEMO_ENTRA_AUDIENCE_DEV:}
    # End-to-end encryption (tsanetgit/Connect_SDK#149). Off, and the demo unchanged, until the
    # private JWKS is set: one RSA-OAEP-256 encryption key and one P-256 signing key, generated
    # by the key generator (docs/RUNBOOK.md) and kept in SSM on the hosted demo. One key pair
    # serves both environments; the partner table is per environment, and each seed restores
    # that environment's table when its file is absent (the hosted data dir is ephemeral).
    e2ee:
      private-jwks: ${TSANET_DEMO_E2EE_PRIVATE_JWKS:}
      partner-seeds:
        beta: ${TSANET_DEMO_E2EE_PARTNERS_BETA:}
        dev: ${TSANET_DEMO_E2EE_PARTNERS_DEV:}
    auth:
      # Blank usernames fall back to "demo" and "guest" in DemoAuthProperties, the one
      # place those defaults live.
      username: ${TSANET_DEMO_AUTH_USER:}
      password: ${TSANET_DEMO_AUTH_PASSWORD:}
      # Optional second login with the same rights and a lower upload limit, for members using a hosted demo
      # (tsanetgit/Connect_SDK#148). Active only when its password is set; a guest
      # password with no operator password, or the same username for both, fails startup.
      guest:
        username: ${TSANET_DEMO_AUTH_GUEST_USER:}
        password: ${TSANET_DEMO_AUTH_GUEST_PASSWORD:}
        # A guest login's upload limit, in bytes. Blank means 1 GB (in DemoAuthProperties). The
        # operator keeps spring.servlet.multipart's limit above.
        max-upload-bytes: ${TSANET_DEMO_AUTH_GUEST_MAX_UPLOAD_BYTES:}
