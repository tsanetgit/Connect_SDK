name: spec-develop

# Builds connect-library against Connect-API-Code's develop spec, daily and on
# demand. verify builds against beta and runs only when this repo changes, so a
# develop spec change that breaks the generated client would otherwise go unseen
# until it reached beta. It was first proposed as a job on every
# Connect-API-Code PR (tsanetgit/Connect-API-Code#164) and lives here instead so
# a red main in this repo cannot fail API PRs.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "Connect-API-Code branch, tag or SHA to build against (blank: develop)"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same fail-loudly rule as verify: the spec repo is private, and a skipped
      # build that reads as success is worse than a red one.
      - name: Require the spec-repo token
        env:
          HAVE_TOKEN: ${{ secrets.CONNECT_API_CODE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error::The CONNECT_API_CODE_TOKEN secret is not available. The build generates connect-library's client from the Connect-API-Code spec (a private repo), so a read token for it is required."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Connect_SDK
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tsanetgit/Connect-API-Code
          ref: ${{ inputs.spec-ref || 'develop' }}
          token: ${{ secrets.CONNECT_API_CODE_TOKEN }}
          path: Connect-API-Code
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build connect-library against the spec
        working-directory: Connect_SDK
        run: mvn -B --no-transfer-progress -pl connect-library -am verify
